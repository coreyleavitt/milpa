[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milpa"
version = "0.0.1"
description = "Nim dependency resolver — reads milpa.kdl, emits nim.cfg, bypasses nimble's broken SAT solver."
authors = [{name = "Corey Leavitt", email = "corey@knurl.io"}]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # KDL 2.0 parser (tabatkins/kdlpy); pinned to exact SHA — swap to kdl-py>=2.0
    # when it publishes to PyPI.  SHA verified 2026-06-12 as main HEAD.
    "kdl-py @ git+https://github.com/tabatkins/kdlpy.git@d9a220762fb9f55e4f59296256221084c26f54da",
    # Sigstore bundle verification — whole-index attestation gate (RFC registry-trust-federation
    # §5.3).  Deliberate exception to milpa's dep-light posture: signature and transparency-log
    # verification MUST NOT be hand-rolled, and shelling out to cosign at resolve time adds an
    # unacceptable external binary dep.  sigstore-python is the Sigstore project's own library
    # and supports offline bundle verification (no live Rekor call at resolve time).
    "sigstore >= 3.0.0",
]

[project.scripts]
milpa = "milpa.cli:main"

[project.urls]
Homepage = "https://github.com/coreyleavitt/milpa"

[tool.milpa]
# Conformance declaration (rfc-conformance-parity §3.5 / spec §1.4 NORMATIVE).
# Mirrors the Rust impl's [package.metadata.milpa] in
# crates/milpa-conformance/Cargo.toml. spec-version is the epoch this impl
# claims (the §3.4 multi-epoch filter); corpus names the fixture tree under
# the repo-root conformance/. The Python impl's per-fixture known-failing set
# is maintained in tests/test_conformance.py (_NOT_YET_WIRED_FIXTURE_NAMES)
# and harness/descriptors.py rather than a standalone file.
spec-version = "1.0"
corpus = "spec-v1"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["milpa"]

[dependency-groups]
dev = [
    "pytest >= 8",
    "hypothesis >= 6",
    "mypy >= 1.10",
    "ruff >= 0.4",
    # S7a reference-plugin fixture — installed so its entry point populates
    # importlib.metadata and exercises the real discovery path in tests.
    # Source is mapped to the local path via [tool.uv.sources] below.
    "milpa-fetcher-stub",
]

[tool.uv.sources]
milpa-fetcher-stub = { path = "tests/fixtures/milpa_fetcher_stub", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end test using real network access. Opt-in via MILPA_INTEGRATION_TESTS=1.",
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
