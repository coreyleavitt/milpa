[workspace]
resolver = "2"
members = [
    "crates/milpa-types",
    "crates/milpa-solver",
    "crates/milpa-manifest",
    "crates/milpa-core",
    "crates/milpa-cli",
    "crates/milpa-conformance",
]

# Shared dependency versions, pinned by the S0 de-risking spikes (RFC §6 S0):
#   kdl 6.7.1   — parse only (annotation + value reachable; line/col on error)
#   pubgrub 0.4.0 — DependencyProvider seam; prioritize() = BFS order P
#   miette 7.6.0  — kdl's diagnostic substrate
[workspace.dependencies]
milpa-types = { path = "crates/milpa-types" }
milpa-solver = { path = "crates/milpa-solver" }
milpa-manifest = { path = "crates/milpa-manifest" }
milpa-core = { path = "crates/milpa-core" }
# milpa.kdl is KDL **2.0** (grammar §1; #123 migrated from 1.0).
# kdl-rs's default `parse` is the KDL 2.0 parser — `#true`/`#false`/`#null`
# are the boolean/null keywords; bare `true`/`false` are reserved identifiers
# and are rejected as syntax errors. No `v1` feature needed.
kdl = { version = "=6.7.1" }
miette = "=7.6.0"
pubgrub = "=0.4.0"
sha2 = "0.10"

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
publish = false

# TEMPORARY (milpa patch validation): use a locally-patched sigstore that drops the
# unsound DSSE envelopeHash re-serialization check (see .vendor-sigstore models.rs).
# rfc-attestation-verifier — replace with an upstream-fork git patch or drop once merged.
[patch.crates-io]
sigstore = { path = ".vendor-sigstore" }
