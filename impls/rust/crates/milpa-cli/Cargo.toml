[package]
name = "milpa-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "milpa"
path = "src/main.rs"

[dependencies]
milpa-core = { workspace = true }
milpa-manifest = { workspace = true }
tempfile = "3"
# deps-rationale: P3a (RFC per-entry-attestation.md §5 conformance seam):
# build_entry_trust_gate parses MILPA_ENTRY_TRUST_MOCK_MAP (a JSON object of
# subject-coordinate -> result-string) — the same conformance-internal seam
# shape MILPA_INDEX_TRUST_MOCK_VERIFIER uses for a single value. Was
# previously a dev-only dependency (tampered-bundle test fixtures); now also
# needed by production CLI code, so it moves out of [dev-dependencies].
serde_json = "1"

[dev-dependencies]
# S-Acq test-only: hashing a fixture bundle's bytes to compute its content-
# addressed pin (mirrors milpa-core's own sha2 usage; workspace-pinned version).
sha2 = { workspace = true }
