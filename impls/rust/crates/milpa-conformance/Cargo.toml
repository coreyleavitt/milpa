[package]
name = "milpa-conformance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Conformance declaration (RFC §4.6 / S12): the spec epoch this implementation
# targets and the file enumerating fixtures not yet expected to pass. The corpus
# `#[test]` reads `known-failing` directly; `spec-version` records which frozen
# `spec` epoch (and `conformance/spec-v<N>/` corpus) this runner is
# checked against.
[package.metadata.milpa]
spec-version = "1.0"
corpus = "spec-v1"
known-failing = "known_failing.txt"

[dependencies]
# `test-support`: the runner's in-process bypass sites construct a bare `Index`
# from fixture bytes and wrap it via `GatedIndex::for_test` (RFC
# trusted-index-invariant.md §2.6) — see milpa-core's Cargo.toml for why this
# needs a real feature flag rather than `#[cfg(test)]`.
milpa-core = { workspace = true, features = ["test-support"] }
milpa-types = { workspace = true }
# Used in run_index_trust_fixture (Item 4 M4): real workspace manifest writes for
# fixture-355 and fixture-349 runners require a temp dir outside the fixture dir.
tempfile = "3"
# deps-rationale: P3a (RFC per-entry-attestation.md §3, §5, Conformance
# section) — fixture_entry_trust_config parses MILPA_ENTRY_TRUST_MOCK_MAP (a
# JSON object of subject-coordinate -> result-string), the shared fixture
# env-var contract mirrored from the Python in-process adapter's
# `_fixture_entry_trust_config`.
serde_json = "1"
