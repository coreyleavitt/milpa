[package]
name = "milpa-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
milpa-types = { workspace = true }
milpa-solver = { workspace = true }
milpa-manifest = { workspace = true }
sha2 = { workspace = true }
kdl = { workspace = true }
flate2 = "1.1.9"
bzip2-rs = "0.1"
lzma-rs = "0.3"
tar = "0.4"
# deps-rationale: used in index_trust.rs for Sigstore bundle JSON parsing (integratedTime
# extraction, bundle structure validation) without hand-rolling a parser. Also used by the
# S4b SigstoreVerifier retrofit once DSSE/in-toto support lands in sigstore-rs.
serde_json = "1"
# deps-rationale: Sigstore bundle verification MUST NOT be hand-rolled and shelling out
# to `cosign` at resolve time is unacceptable (adds an external binary dep, shell-injection
# surface, conformance test friction). The `sigstore` crate is the Sigstore project's own
# Rust library; it is a deliberate, justified exception to milpa's dep-light posture.
# RFC: rfc-registry-trust-federation §5.3.
#
# S4 spike verdict: INSUFFICIENT — sigstore 0.11.0 does NOT support DSSE/in-toto
# attestation bundles (BundleErrorKind::DsseUnsupported).
# S4b mini-spike (low-level primitives) verdict: NOT VIABLE — two blocking gaps:
#   (1) CertificatePool (cert chain at integratedTime) is pub(crate) only.
#   (2) Rekor SET / inclusion proof verification is TODO (sigstore-rs#285) — not
#       implemented even for the MessageSignature path.
# S4b is DEFERRED pending upstream sigstore-rs fixing both gaps. The crate is retained
# here as the planned dep; SigstoreVerifier is a placeholder. Retry S4b when sigstore-rs
# ships DSSE support + Rekor SET verification (sigstore-rs#285).
sigstore = "0.11"

[dev-dependencies]
tempfile = "3"
